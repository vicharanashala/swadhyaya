<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1614"/>
      <stop offset="100%" stop-color="#2c2622"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,245,230,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <circle cx="40" cy="40" r="34" stroke="#e8864a" stroke-width="3" fill="none"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#e8864a" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#e8864a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="40" r="3.5" fill="#e8864a"/>
    <circle cx="80" cy="40" r="3.5" fill="#e8864a"/>
    <circle cx="40" cy="0" r="3.5" fill="#e8864a"/>
    <circle cx="40" cy="80" r="3.5" fill="#e8864a"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="280" font-family="Source Serif 4, Georgia, serif" font-size="92" font-weight="700" fill="#ede8e3">Swadhyaya</text>

  <!-- Tagline -->
  <text x="80" y="360" font-family="DM Sans, system-ui, sans-serif" font-size="36" fill="#a89e94">Linear algebra, intuition-first.</text>
  <text x="80" y="410" font-family="DM Sans, system-ui, sans-serif" font-size="36" fill="#a89e94">From a number on a line to SVD — see it, drag it,</text>
  <text x="80" y="460" font-family="DM Sans, system-ui, sans-serif" font-size="36" fill="#a89e94">discover the formula by playing.</text>

  <!-- Stat strip -->
  <g transform="translate(80, 530)">
    <rect x="0" y="0" width="190" height="60" rx="6" fill="#362f2a" stroke="rgba(255,245,230,0.18)"/>
    <text x="20" y="38" font-family="ui-monospace, monospace" font-size="28" fill="#e8864a">44</text>
    <text x="70" y="38" font-family="DM Sans, sans-serif" font-size="20" fill="#a89e94">concepts</text>

    <rect x="220" y="0" width="160" height="60" rx="6" fill="#362f2a" stroke="rgba(255,245,230,0.18)"/>
    <text x="240" y="38" font-family="ui-monospace, monospace" font-size="28" fill="#e8864a">6</text>
    <text x="270" y="38" font-family="DM Sans, sans-serif" font-size="20" fill="#a89e94">phases</text>

    <rect x="410" y="0" width="220" height="60" rx="6" fill="#362f2a" stroke="rgba(255,245,230,0.18)"/>
    <text x="430" y="38" font-family="ui-monospace, monospace" font-size="28" fill="#e8864a">100%</text>
    <text x="500" y="38" font-family="DM Sans, sans-serif" font-size="20" fill="#a89e94">hands-on</text>
  </g>

  <!-- URL -->
  <text x="80" y="600" font-family="DM Sans, sans-serif" font-size="20" fill="#6b6058">swadhyaya.app</text>
</svg>